\" viewBox=\"0 0 24 24\"><path d=\"m5 12 4 4L19 6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></symbol>\r\n  </defs></svg>\r\n  <main class=\"page\">\r\n    <section class=\"story\" aria-label=\"Meet Klaidorbot\">\r\n      <a class=\"brand\" href=\"./\" aria-label=\"Klaidorbot home\"><span class=\"brand-mark\"><svg aria-hidden=\"true\"><use href=\"#bot\"/></svg></span>Klaidorbot<span class=\"brand-dot\">.</span></a>\r\n      <div class=\"story-content\">\r\n        <div class=\"eyebrow\"><span></span> A LITTLE HELP. A LOT OF POSSIBILITIES.</div>\r\n        <h1>Great questions.<br><em>Instant answers.</em></h1>\r\n        <p class=\"intro\">Turn your FAQs into helpful conversations. Build a chatbot that knows your business, and give every visitor a warm welcome.</p>\r\n        <div class=\"chat\" aria-label=\"Interactive FAQ chatbot example\">\r\n          <div class=\"chat-head\"><div class=\"bot-avatar\"><svg aria-hidden=\"true\"><use href=\"#bot\"/></svg></div><div><div class=\"chat-title\">Your helpful assistant</div><div class=\"online\">Always here to help</div></div><span class=\"chat-live\">LIVE DEMO</span></div>\r\n          <div class=\"chat-body\" aria-live=\"polite\" aria-atomic=\"true\"><div class=\"bubble question\" id=\"demo-question\">Can I use my existing FAQs? 👋</div><div class=\"bubble answer\"><span id=\"demo-answer\">Absolutely! Add your FAQs and I’ll turn them into friendly, instant answers for your visitors. Easy as that.</span><div class=\"answer-source\"><svg width=\"11\" height=\"11\" aria-hidden=\"true\"><use href=\"#check\"/></svg> Answered from your knowledge base</div></div></div>\r\n          <div class=\"chat-options\"><button type=\"button\" data-faq=\"setup\">How do I get started?</button><button type=\"button\" data-faq=\"availability\">Are you available 24/7?</button></div>\r\n          <div class=\"chat-footer\">A little conversation, powered by <span class=\"sparkle\">✧</span> Klaidorbot</div>\r\n        </div>\r\n        <div class=\"benefits\"><span><svg aria-hidden=\"true\"><use href=\"#check\"/></svg> Your FAQs, connected</span><span><svg aria-hidden=\"true\"><use href=\"#check\"/></svg> Support, around the clock</span></div>\r\n      </div>\r\n      <div class=\"story-bottom\"><span>Thoughtful answers. Happier customers.</span><span>Made for conversations</span></div>\r\n    </section>\r\n    <section class=\"login-side\" aria-labelledby=\"login-title\">\r\n      <div class=\"top-link\"><a class=\"brand mobile-brand\" href=\"./\"><span class=\"brand-mark\"><svg aria-hidden=\"true\"><use href=\"#bot\"/></svg></span>Klaidorbot.</a><span>Have a question?<a href=\"#help\" data-dialog=\"help\">Get help ↗</a></span></div>\r\n      <div class=\"form-wrap\">\r\n        <div class=\"welcome-icon\"><svg aria-hidden=\"true\"><use href=\"#bot\"/></svg></div>\r\n        <header>\r\n          <p class=\"login-brand\">Klaidorbot</p>\r\n          <h2 id=\"login-title\">Login</h2>\r\n          <p class=\"subtitle\">Welcome back. Sign in with your username and password<br>to manage your chatbots and FAQs.</p>\r\n        </header>\r\n        <form id=\"login-form\" method=\"post\">\r\n          <div class=\"field\"><label for=\"username\">Username:</label><div class=\"input-wrap\"><svg aria-hidden=\"true\"><use href=\"#user\"/></svg><input type=\"text\" id=\"username\" name=\"username\" placeholder=\"Enter your username\" maxlength=\"32\" autocomplete=\"username\" autocapitalize=\"none\" spellcheck=\"false\" required></div></div>\r\n          <div class=\"field\"><label for=\"password\">Password:</label><div class=\"input-wrap\"><svg aria-hidden=\"true\"><use href=\"#lock\"/></svg><input type=\"password\" id=\"password\" name=\"password\" placeholder=\"Enter your password\" autocomplete=\"current-password\" maxlength=\"128\" required><button class=\"show-password\" type=\"button\" aria-label=\"Show password\" aria-pressed=\"false\"><svg aria-hidden=\"true\"><use href=\"#eye\"/></svg></button></div></div>\r\n          <div class=\"form-options\"><label class=\"remember\"><input type=\"checkbox\" id=\"remember-me\" name=\"remember-me\">Remember Me</label><a href=\"#forgot-password\" id=\"forgot-password\" class=\"text-button\" data-dialog=\"reset\">Forgot Password?</a></div>\r\n          <button class=\"submit\" type=\"submit\" disabled>Login<svg aria-hidden=\"true\"><use href=\"#arrow\"/></svg></button>\r\n          <div class=\"status\" role=\"status\" id=\"form-status\"></div>\r\n        </form>\r\n        <div class=\"divider\">NEW TO KLAIDORBOT?</div>\r\n        <div class=\"social-links\" aria-label=\"Follow Klaidorbot\"><a href=\"https://www.facebook.com/\" target=\"_blank\" rel=\"noopener noreferrer\">Facebook</a><a href=\"https://twitter.com/\" target=\"_blank\" rel=\"noopener noreferrer\">Twitter</a><a href=\"https://www.linkedin.com/\" target=\"_blank\" rel=\"noopener noreferrer\">LinkedIn</a></div>\r\n        <p class=\"signup\">Don’t have an account? <a href=\"#signup\" class=\"text-button\" data-dialog=\"signup\">Sign up for free!</a></p>\r\n        <div class=\"trust\"><svg aria-hidden=\"true\"><use href=\"#lock\"/></svg> A little peace of mind, built in.</div>\r\n      </div>\r\n      <footer class=\"login-bottom\"><span>© <span id=\"year\">2026</span> Klaidorbot</span><div class=\"legal\"><a href=\"#terms\" class=\"text-button\" data-dialog=\"terms\">Terms of Use</a><span aria-hidden=\"true\">|</span><a href=\"#privacy\" class=\"text-button\" data-dialog=\"privacy\">Privacy Policy</a></div></footer>\r\n    </section>\r\n  </main>\r\n  <dialog id=\"info-dialog\" aria-labelledby=\"dialog-title\"><h2 id=\"dialog-title\"></h2><p id=\"dialog-copy\"></p><form method=\"dialog\"><button class=\"submit\">Got it</button></form></dialog>\r\n  <dialog id=\"account-dialog\" aria-labelledby=\"account-title\">\r\n    <h2 id=\"account-title\">Create your account</h2>\r\n    <p id=\"account-description\"></p>\r\n    <form id=\"account-form\" method=\"post\">\r\n      <div class=\"field\"><label for=\"account-username\">Username</label><input id=\"account-username\" name=\"username\" type=\"text\" autocomplete=\"username\" autocapitalize=\"none\" spellcheck=\"false\" pattern=\"[A-Za-z0-9._\\-]{3,32}\" minlength=\"3\" maxlength=\"32\" required></div>\r\n      <div class=\"field\" id=\"recovery-field\" hidden><label for=\"recovery-code\">Recovery code</label><input id=\"recovery-code\" name=\"recoveryCode\" type=\"text\" autocomplete=\"off\" spellcheck=\"false\" maxlength=\"64\"></div>\r\n      <div class=\"field\"><label for=\"account-password\">Password (12–128 characters)</label><input id=\"account-password\" name=\"password\" type=\"password\" autocomplete=\"new-password\" minlength=\"12\" maxlength=\"128\" required></div>\r\n      <button class=\"submit\" id=\"account-submit\" type=\"submit\">Create account</button>\r\n    </form>\r\n    <div id=\"recovery-result\" hidden>\r\n      <p>Save this recovery code in a safe place. You’ll need it if you forget your password. It is shown only once.</p>\r\n      <div class=\"field\"><label for=\"saved-recovery-code\">Your recovery code</label><input id=\"saved-recovery-code\" type=\"text\" readonly autocomplete=\"off\" spellcheck=\"false\"></div>\r\n      <button class=\"submit\" type=\"button\" id=\"recovery-done\">I saved my code</button>\r\n    </div>\r\n    <p class=\"status\" id=\"account-status\" role=\"status\"></p>\r\n    <button class=\"text-button\" type=\"button\" id=\"account-close\" style=\"margin-top:18px\">Close</button>\r\n  </dialog>";

ry your assistant.</p>\r\n    <p id=\"page-status\" role=\"status\">Loading your workspace…</p>\r\n    <button id=\"retry-load\" type=\"button\" class=\"secondary\" hidden>Retry loading</button>\r\n    <section class=\"card share-card\" aria-labelledby=\"share-title\">\r\n      <h2 id=\"share-title\">Share your chatbot</h2>\r\n      <p class=\"hint\">Anyone with this link can ask questions answered from all FAQs in this workspace. Only matched answers and their source questions are shown.</p>\r\n      <label for=\"public-chat-link\">Public chat link</label>\r\n      <div class=\"share-link-row\"><input id=\"public-chat-link\" type=\"url\" readonly><a id=\"open-public-chat\" class=\"button-link\" target=\"_blank\" rel=\"noopener noreferrer\">Open chatbot</a></div>\r\n      <label for=\"public-embed-code\">Embed on another website</label>\r\n      <textarea id=\"public-embed-code\" rows=\"3\" readonly></textarea>\r\n    </section>\r\n    <div class=\"columns\">\r\n      <section class=\"card\" aria-labelledby=\"faq-title\">\r\n        <h2 id=\"faq-title\">Your knowledge base</h2>\r\n        <form id=\"faq-form\">\r\n          <label for=\"question\">Question</label><input disabled id=\"question\" name=\"question\" maxlength=\"500\" placeholder=\"What are your opening hours?\" required>\r\n          <label for=\"answer\">Answer</label><textarea disabled id=\"answer\" name=\"answer\" maxlength=\"5000\" rows=\"4\" placeholder=\"Write the answer your assistant should give…\" required></textarea>\r\n          <div class=\"actions\"><button disabled id=\"save-faq\" type=\"submit\">Add FAQ</button><button id=\"cancel-edit\" class=\"secondary\" type=\"button\" hidden>Cancel edit</button></div>\r\n          <p id=\"faq-status\" role=\"status\"></p>\r\n        </form>\r\n        <div id=\"faq-list\" aria-label=\"Saved FAQs\"></div>\r\n      </section>\r\n      <section class=\"card chat-card\" aria-labelledby=\"chat-title\">\r\n        <div class=\"chat-heading\"><h2 id=\"chat-title\">Try your assistant</h2><span>FAQ search</span></div>\r\n        <p class=\"hint\">Answers come from your saved FAQs. If a question has no clear match, the assistant will say so.</p>\r\n        <div id=\"conversation\" role=\"log\" aria-live=\"polite\" aria-relevant=\"additions\" aria-label=\"Conversation\"><p class=\"bot-message\">Hi! Add an FAQ, then ask me a question about it.</p></div>\r\n        <form id=\"chat-form\"><label for=\"chat-question\">Your question</label><input disabled id=\"chat-question\" name=\"question\" maxlength=\"500\" placeholder=\"Ask about your FAQs…\" required><button disabled id=\"send-question\" type=\"submit\">Send question →</button><p id=\"chat-status\" role=\"status\"></p></form>\r\n      </section>\r\n    </div>\r\n  </main>";

async function showLogin() {
  root.innerHTML = loginMarkup;
  await mountLogin({ root, navigate: showWorkspace });
}

async function showWorkspace() {
  root.innerHTML = workspaceMarkup;
  await mountWorkspace({ root, navigate: showLogin });
}

await showLogin();</script>
