<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Klaidorbot · FAQ workspace</title><style>body{margin:0;background:#fafbf7}#klaidorbot{display:block;min-height:100vh}</style></head><body><div id="klaidorbot"></div><noscript>Enable JavaScript to use Klaidorbot.</noscript><script type="module">
let embedded = false;
let session = null;
const storageKey = 'klaidorbot.embed.session';
function storage(name) { try { return window[name]; } catch { return null; } }
function readSession(name) {
  try {
    const value = JSON.parse(storage(name)?.getItem(storageKey) || 'null');
    return value && /^[a-f0-9]{64}$/.test(value.token) && value.expiresAt > Date.now() ? value : null;
  } catch { return null; }
}
function clearSession() {
  session = null;
  for (const name of ['sessionStorage', 'localStorage']) {
    try { storage(name)?.removeItem(storageKey); } catch { /* Storage may be blocked in an embed. */ }
  }
}
function configureEmbeddedClient() {
  embedded = true;
  session = readSession('localStorage') || readSession('sessionStorage');
}
function saveSession(data, remember) {
  clearSession();
  session = { token: data.sessionToken, expiresAt: data.expiresAt };
  try { storage(remember ? 'localStorage' : 'sessionStorage')?.setItem(storageKey, JSON.stringify(session)); }
  catch { /* In-memory login continues to work when embedded storage is blocked. */ }
}

async function api(path, { method = 'GET', body } = {}) {
  const response = await fetch(path, {
    method,
    credentials: embedded ? 'omit' : 'same-origin',
    headers: {
      ...(body === undefined ? {} : { 'Content-Type': 'application/json' }),
      ...(embedded ? { 'X-Klaidorbot-Client': 'embed', ...(session ? { Authorization: `Bearer ${session.token}` } : {}) } : {}),
    },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  let data;
  try {
    data = await response.json();
    if (!data || typeof data !== 'object' || Array.isArray(data)) throw new Error();
  } catch {
    const error = new Error('The server returned an invalid response. Please try again.');
    error.status = response.status;
    throw error;
  }
  if (embedded && response.status === 401 && path !== '/api/login') clearSession();
  if (!response.ok) {
    const error = new Error(data.error || 'The server could not complete your request.');
    error.status = response.status;
    throw error;
  }
  if (embedded) {
    if ((path === '/api/register' || path === '/api/login') && data.sessionToken) saveSession(data, body?.remember === true);
    if (path === '/api/logout' || path === '/api/reset-password') clearSession();
  }
  return data;
}

function errorMessage(error) {
  return error instanceof TypeError ? 'Unable to reach the server. Check your connection and try again.' : error.message;
}


async function mountLogin({ root = document, navigate = () => location.assign('/workspace') } = {}) {

const password = root.querySelector('#password');
const status = root.querySelector('#form-status');
const loginForm = root.querySelector('#login-form');
const loginButton = loginForm.querySelector('[type=submit]');
let loggingIn = false;
let checkingSession = true;
loginButton.disabled = true;
root.querySelector('.show-password').addEventListener('click', function () {
  const show = password.type === 'password';
  password.type = show ? 'text' : 'password';
  this.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  this.setAttribute('aria-pressed', String(show));
});
loginForm.addEventListener('submit', async event => {
  event.preventDefault();
  if (checkingSession || loggingIn || accountDialog.open) return;
  loggingIn = true;
  loginButton.disabled = true;
  status.textContent = 'Logging in…';
  try {
    await api('/api/login', { method: 'POST', body: {
      username: loginForm.elements.username.value,
      password: password.value,
      remember: loginForm.elements['remember-me'].checked,
    } });
    password.value = '';
    navigate();
  } catch (error) { status.textContent = errorMessage(error); }
  finally { loggingIn = false; loginButton.disabled = false; }
});

const content = {
  help: ['A little help getting started', 'Create an account, save your recovery code, and add questions and answers to your FAQ workspace. You can test your chatbot against those saved FAQs.'],
  terms: ['Terms of use', 'Published terms of use must be added by the site owner before the service launches publicly.'],
  privacy: ['Privacy policy', 'This application stores your username, a password hash, a recovery code hash, login sessions and your FAQs in its database. The site owner must publish a complete privacy policy before public launch.'],
};
const infoDialog = root.querySelector('#info-dialog');
const accountDialog = root.querySelector('#account-dialog');
const accountForm = root.querySelector('#account-form');
const accountStatus = root.querySelector('#account-status');
const accountButton = root.querySelector('#account-submit');
const recoveryResult = root.querySelector('#recovery-result');
const savedRecoveryCode = root.querySelector('#saved-recovery-code');
let mode = 'signup';
let accountBusy = false;
function openAccount(nextMode) {
  if (checkingSession || loggingIn || accountBusy) return;
  mode = nextMode;
  accountForm.reset();
  accountForm.hidden = false;
  recoveryResult.hidden = true;
  savedRecoveryCode.value = '';
  accountStatus.textContent = '';
  const reset = mode === 'reset';
  root.querySelector('#account-title').textContent = reset ? 'Reset your password' : 'Create your account';
  root.querySelector('#account-description').textContent = reset
    ? 'Enter your username and the recovery code you saved when you created your account.'
    : 'Choose a username with 3–32 letters, numbers, underscores or hyphens.';
  root.querySelector('#recovery-field').hidden = !reset;
  root.querySelector('#recovery-code').required = reset;
  accountButton.textContent = reset ? 'Reset password' : 'Create account';
  accountDialog.showModal();
}
root.querySelectorAll('[data-dialog]').forEach(link => link.addEventListener('click', event => {
  event.preventDefault();
  const type = link.dataset.dialog;
  if (type === 'signup' || type === 'reset') return openAccount(type);
  const [title, copy] = content[type];
  root.querySelector('#dialog-title').textContent = title;
  root.querySelector('#dialog-copy').textContent = copy;
  infoDialog.showModal();
}));
accountForm.addEventListener('submit', async event => {
  event.preventDefault();
  if (accountBusy) return;
  accountBusy = true;
  for (const input of accountForm.elements) input.disabled = true;
  accountStatus.textContent = 'Saving…';
  try {
    const data = await api(mode === 'signup' ? '/api/register' : '/api/reset-password', { method: 'POST', body: {
      username: accountForm.elements.username.value,
      password: accountForm.elements.password.value,
      recoveryCode: accountForm.elements.recoveryCode.value,
    } });
    accountForm.reset();
    accountForm.hidden = true;
    savedRecoveryCode.value = data.recoveryCode;
    recoveryResult.hidden = false;
    accountStatus.textContent = mode === 'signup' ? 'Your account is ready.' : 'Password updated. Your old recovery code and login sessions have been revoked.';
    savedRecoveryCode.focus();
  } catch (error) { accountStatus.textContent = errorMessage(error); }
  finally { accountBusy = false; for (const input of accountForm.elements) input.disabled = false; }
});
root.querySelector('#account-close').addEventListener('click', () => { if (!accountBusy) accountDialog.close(); });
accountDialog.addEventListener('cancel', event => { if (accountBusy) event.preventDefault(); });
accountDialog.addEventListener('close', () => {
  accountForm.reset();
  savedRecoveryCode.value = '';
});
root.querySelector('#recovery-done').addEventListener('click', () => {
  accountDialog.close();
  if (mode === 'signup') navigate();
  else { status.textContent = 'Password updated. Log in with your new password.'; root.querySelector('#username').focus(); }
});

const answers = {
  setup: ['How do I get started?', 'Create an account, add your FAQ questions and answers, and test your assistant in your workspace.'],
  availability: ['Are you available 24/7?', 'Your FAQ assistant can answer whenever this website is online. Keep your FAQ answers up to date to help visitors.'],
};
root.querySelectorAll('[data-faq]').forEach(button => button.addEventListener('click', () => {
  const [question, answer] = answers[button.dataset.faq];
  root.querySelector('#demo-question').textContent = question;
  root.querySelector('#demo-answer').textContent = answer;
}));
root.querySelector('#year').textContent = new Date().getFullYear();
const accountLinks = root.querySelectorAll('[data-dialog="signup"], [data-dialog="reset"]');
for (const link of accountLinks) link.setAttribute('aria-disabled', 'true');
status.textContent = 'Checking your session…';
try {
  await api('/api/me');
  navigate();
} catch (error) {
  status.textContent = error.status === 401 ? '' : errorMessage(error);
  checkingSession = false;
  loginButton.disabled = false;
  for (const link of accountLinks) link.removeAttribute('aria-disabled');
}

}

if (document.querySelector('#login-form')) await mountLogin();


async function mountWorkspace({ root = document, navigate = () => location.replace('/') } = {}) {

const pageStatus = root.querySelector('#page-status');
const faqForm = root.querySelector('#faq-form');
const faqStatus = root.querySelector('#faq-status');
const faqList = root.querySelector('#faq-list');
const saveButton = root.querySelector('#save-faq');
const cancelButton = root.querySelector('#cancel-edit');
let editingId = null;
let busy = true;
let ready = false;
const chatForm = root.querySelector('#chat-form');
const chatStatus = root.querySelector('#chat-status');
const logoutButton = root.querySelector('#logout');
const retryButton = root.querySelector('#retry-load');
let faqs = [];

function showError(target, error) {
  if (error.status === 401) navigate();
  else target.textContent = errorMessage(error);
}
function resetEditor() {
  faqForm.reset(); editingId = null; saveButton.textContent = 'Add FAQ'; cancelButton.hidden = true;
}
function renderFaqs() {
  faqList.replaceChildren();
  if (!faqs.length) {
    const empty = document.createElement('p'); empty.className = 'empty';
    empty.textContent = 'No FAQs yet. Add your first question and answer above.'; faqList.append(empty);
  }
  for (const faq of faqs) {
    const article = document.createElement('article'); article.className = 'faq-item';
    const title = document.createElement('h3'); title.textContent = faq.question;
    const answer = document.createElement('p'); answer.textContent = faq.answer;
    const actions = document.createElement('div'); actions.className = 'actions';
    const edit = document.createElement('button'); edit.type = 'button'; edit.className = 'secondary'; edit.textContent = 'Edit';
    edit.disabled = busy || !ready;
    edit.addEventListener('click', () => {
      if (busy || !ready) return;
      editingId = faq.id; faqForm.elements.question.value = faq.question; faqForm.elements.answer.value = faq.answer;
      saveButton.textContent = 'Save changes'; cancelButton.hidden = false; faqStatus.textContent = ''; faqForm.elements.question.focus();
    });
    const remove = document.createElement('button'); remove.type = 'button'; remove.className = 'secondary'; remove.textContent = 'Delete'; remove.disabled = busy || !ready;
    const cancelDelete = document.createElement('button');
    cancelDelete.type = 'button'; cancelDelete.className = 'secondary'; cancelDelete.textContent = 'Cancel'; cancelDelete.hidden = true;
    let confirmingDelete = false;
    cancelDelete.addEventListener('click', () => {
      confirmingDelete = false; remove.textContent = 'Delete'; cancelDelete.hidden = true;
    });
    remove.addEventListener('click', async () => {
      if (busy || !ready) return;
      if (!confirmingDelete) {
        confirmingDelete = true; remove.textContent = 'Confirm delete'; cancelDelete.hidden = false; return;
      }
      setBusy(true);
      try {
        await api(`/api/faqs/${faq.id}`, { method: 'DELETE', body: {} });
        faqs = faqs.filter(item => item.id !== faq.id);
        if (editingId === faq.id) resetEditor();
        faqStatus.textContent = 'FAQ deleted.';
      } catch (error) { showError(faqStatus, error); }
      finally { renderFaqs(); setBusy(false); }
    });
    actions.append(edit, remove, cancelDelete); article.append(title, answer, actions); faqList.append(article);
  }
}
function setBusy(value) {
  busy = value;
  for (const form of [faqForm, chatForm]) {
    form.setAttribute('aria-busy', String(value));
    for (const input of form.elements) input.disabled = value || !ready;
  }
  logoutButton.disabled = value;
  retryButton.disabled = value;
  for (const button of faqList.querySelectorAll('button')) button.disabled = value || !ready;
}
cancelButton.addEventListener('click', () => { if (busy || !ready) return; resetEditor(); faqStatus.textContent = ''; });
faqForm.addEventListener('submit', async event => {
  event.preventDefault();
  if (busy || !ready) return;
  const id = editingId;
  const body = { question: faqForm.elements.question.value, answer: faqForm.elements.answer.value };
  setBusy(true); faqStatus.textContent = 'Saving…';
  try {
    const { faq } = await api(id ? `/api/faqs/${id}` : '/api/faqs', { method: id ? 'PUT' : 'POST', body });
    faqs = id ? faqs.map(item => item.id === id ? faq : item) : [faq, ...faqs];
    resetEditor(); faqStatus.textContent = 'FAQ saved. Your assistant can use this answer now.';
  } catch (error) { showError(faqStatus, error); }
  finally { renderFaqs(); setBusy(false); }
});

const conversation = root.querySelector('#conversation');
function message(text, className, source) {
  const bubble = document.createElement('p'); bubble.className = className; bubble.textContent = text;
  if (source) { const label = document.createElement('span'); label.className = 'source'; label.textContent = `From your FAQs: ${source.question}`; bubble.append(label); }
  conversation.append(bubble); conversation.scrollTop = conversation.scrollHeight;
}
chatForm.addEventListener('submit', async event => {
  event.preventDefault(); if (busy || !ready) return;
  setBusy(true);
  const question = chatForm.elements.question.value;
  message(question, 'user-message'); chatStatus.textContent = 'Looking through your FAQs…';
  try {
    const data = await api('/api/chat', { method: 'POST', body: { question } });
    message(data.answer, 'bot-message', data.source); chatForm.reset(); chatStatus.textContent = '';
  } catch (error) { showError(chatStatus, error); }
  finally { setBusy(false); }
});
logoutButton.addEventListener('click', async () => {
  if (busy) return;
  setBusy(true);
  try { await api('/api/logout', { method: 'POST', body: {} }); navigate(); }
  catch (error) { showError(pageStatus, error); setBusy(false); }
});
async function loadWorkspace() {
  ready = false;
  setBusy(true);
  retryButton.hidden = true;
  pageStatus.textContent = 'Loading your workspace…';
  try {
    const { user } = await api('/api/me');
    root.querySelector('#username').textContent = user.username;
    ({ faqs } = await api('/api/faqs'));
    ready = true;
    renderFaqs();
    pageStatus.textContent = '';
  } catch (error) {
    showError(pageStatus, error);
    retryButton.hidden = error.status === 401;
  } finally { setBusy(false); }
}
retryButton.addEventListener('click', () => { if (!busy) loadWorkspace(); });
await loadWorkspace();

}

if (document.querySelector('#faq-form')) await mountWorkspace();

entColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/symbol>\n    \u003csymbol id=\"check\" viewBox=\"0 0 24 24\">\u003cpath d=\"m5 12 4 4L19 6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\u003c/symbol>\n  \u003c/defs>\u003c/svg>\n  \u003cmain class=\"page\">\n    \u003csection class=\"story\" aria-label=\"Meet Klaidorbot\">\n      \u003ca class=\"brand\" href=\"#\" aria-label=\"Klaidorbot home\">\u003cspan class=\"brand-mark\">\u003csvg aria-hidden=\"true\">\u003cuse href=\"#bot\"/>\u003c/svg>\u003c/span>Klaidorbot\u003cspan class=\"brand-dot\">.\u003c/span>\u003c/a>\n      \u003cdiv class=\"story-content\">\n        \u003cdiv class=\"eyebrow\">\u003cspan>\u003c/span> A LITTLE HELP. A LOT OF POSSIBILITIES.\u003c/div>\n        \u003ch1>Great questions.\u003cbr>\u003cem>Instant answers.\u003c/em>\u003c/h1>\n        \u003cp class=\"intro\">Turn your FAQs into helpful conversations. Build a chatbot that knows your business, and give every visitor a warm welcome.\u003c/p>\n        \u003cdiv class=\"chat\" aria-label=\"Interactive FAQ chatbot example\">\n          \u003cdiv class=\"chat-head\">\u003cdiv class=\"bot-avatar\">\u003csvg aria-hidden=\"true\">\u003cuse href=\"#bot\"/>\u003c/svg>\u003c/div>\u003cdiv>\u003cdiv class=\"chat-title\">Your helpful assistant\u003c/div>\u003cdiv class=\"online\">Always here to help\u003c/div>\u003c/div>\u003cspan class=\"chat-live\">LIVE DEMO\u003c/span>\u003c/div>\n          \u003cdiv class=\"chat-body\" aria-live=\"polite\" aria-atomic=\"true\">\u003cdiv class=\"bubble question\" id=\"demo-question\">Can I use my existing FAQs? 👋\u003c/div>\u003cdiv class=\"bubble answer\">\u003cspan id=\"demo-answer\">Absolutely! Add your FAQs and I’ll turn them into friendly, instant answers for your visitors. Easy as that.\u003c/span>\u003cdiv class=\"answer-source\">\u003csvg width=\"11\" height=\"11\" aria-hidden=\"true\">\u003cuse href=\"#check\"/>\u003c/svg> Answered from your knowledge base\u003c/div>\u003c/div>\u003c/div>\n          \u003cdiv class=\"chat-options\">\u003cbutton type=\"button\" data-faq=\"setup\">How do I get started?\u003c/button>\u003cbutton type=\"button\" data-faq=\"availability\">Are you available 24/7?\u003c/button>\u003c/div>\n          \u003cdiv class=\"chat-footer\">A little conversation, powered by \u003cspan class=\"sparkle\">✧\u003c/span> Klaidorbot\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"benefits\">\u003cspan>\u003csvg aria-hidden=\"true\">\u003cuse href=\"#check\"/>\u003c/svg> Your FAQs, connected\u003c/span>\u003cspan>\u003csvg aria-hidden=\"true\">\u003cuse href=\"#check\"/>\u003c/svg> Support, around the clock\u003c/span>\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"story-bottom\">\u003cspan>Thoughtful answers. Happier customers.\u003c/span>\u003cspan>Made for conversations\u003c/span>\u003c/div>\n    \u003c/section>\n    \u003csection class=\"login-side\" aria-labelledby=\"login-title\">\n      \u003cdiv class=\"top-link\">\u003ca class=\"brand mobile-brand\" href=\"#\">\u003cspan class=\"brand-mark\">\u003csvg aria-hidden=\"true\">\u003cuse href=\"#bot\"/>\u003c/svg>\u003c/span>Klaidorbot.\u003c/a>\u003cspan>Have a question?\u003ca href=\"#help\" data-dialog=\"help\">Get help ↗\u003c/a>\u003c/span>\u003c/div>\n      \u003cdiv class=\"form-wrap\">\n        \u003cdiv class=\"welcome-icon\">\u003csvg aria-hidden=\"true\">\u003cuse href=\"#bot\"/>\u003c/svg>\u003c/div>\n        \u003cheader>\n          \u003cp class=\"login-brand\">Klaidorbot\u003c/p>\n          \u003ch2 id=\"login-title\">Login\u003c/h2>\n          \u003cp class=\"subtitle\">Welcome back. Sign in with your username and password\u003cbr>to manage your chatbots and FAQs.\u003c/p>\n        \u003c/header>\n        \u003cform id=\"login-form\" method=\"post\">\n          \u003cdiv class=\"field\">\u003clabel for=\"username\">Username:\u003c/label>\u003cdiv class=\"input-wrap\">\u003csvg aria-hidden=\"true\">\u003cuse href=\"#user\"/>\u003c/svg>\u003cinput type=\"text\" id=\"username\" name=\"username\" placeholder=\"Enter your username\" maxlength=\"32\" autocomplete=\"username\" autocapitalize=\"none\" spellcheck=\"false\" required>\u003c/div>\u003c/div>\n          \u003cdiv class=\"field\">\u003clabel for=\"password\">Password:\u003c/label>\u003cdiv class=\"input-wrap\">\u003csvg aria-hidden=\"true\">\u003cuse href=\"#lock\"/>\u003c/svg>\u003cinput type=\"password\" id=\"password\" name=\"password\" placeholder=\"Enter your password\" autocomplete=\"current-password\" maxlength=\"128\" required>\u003cbutton class=\"show-password\" type=\"button\" aria-label=\"Show password\" aria-pressed=\"false\">\u003csvg aria-hidden=\"true\">\u003cuse href=\"#eye\"/>\u003c/svg>\u003c/button>\u003c/div>\u003c/div>\n          \u003cdiv class=\"form-options\">\u003clabel class=\"remember\">\u003cinput type=\"checkbox\" id=\"remember-me\" name=\"remember-me\">Remember Me\u003c/label>\u003ca href=\"#forgot-password\" id=\"forgot-password\" class=\"text-button\" data-dialog=\"reset\">Forgot Password?\u003c/a>\u003c/div>\n          \u003cbutton class=\"submit\" type=\"submit\" disabled>Login\u003csvg aria-hidden=\"true\">\u003cuse href=\"#arrow\"/>\u003c/svg>\u003c/button>\n          \u003cdiv class=\"status\" role=\"status\" id=\"form-status\">\u003c/div>\n        \u003c/form>\n        \u003cdiv class=\"divider\">NEW TO KLAIDORBOT?\u003c/div>\n        \u003cdiv class=\"social-links\" aria-label=\"Follow Klaidorbot\">\u003ca href=\"https://www.facebook.com/\" target=\"_blank\" rel=\"noopener noreferrer\">Facebook\u003c/a>\u003ca href=\"https://twitter.com/\" target=\"_blank\" rel=\"noopener noreferrer\">Twitter\u003c/a>\u003ca href=\"https://www.linkedin.com/\" target=\"_blank\" rel=\"noopener noreferrer\">LinkedIn\u003c/a>\u003c/div>\n        \u003cp class=\"signup\">Don’t have an account? \u003ca href=\"#signup\" class=\"text-button\" data-dialog=\"signup\">Sign up for free!\u003c/a>\u003c/p>\n        \u003cdiv class=\"trust\">\u003csvg aria-hidden=\"true\">\u003cuse href=\"#lock\"/>\u003c/svg> A little peace of mind, built in.\u003c/div>\n      \u003c/div>\n      \u003cfooter class=\"login-bottom\">\u003cspan>© \u003cspan id=\"year\">2026\u003c/span> Klaidorbot\u003c/span>\u003cdiv class=\"legal\">\u003ca href=\"#terms\" class=\"text-button\" data-dialog=\"terms\">Terms of Use\u003c/a>\u003cspan aria-hidden=\"true\">|\u003c/span>\u003ca href=\"#privacy\" class=\"text-button\" data-dialog=\"privacy\">Privacy Policy\u003c/a>\u003c/div>\u003c/footer>\n    \u003c/section>\n  \u003c/main>\n  \u003cdialog id=\"info-dialog\" aria-labelledby=\"dialog-title\">\u003ch2 id=\"dialog-title\">\u003c/h2>\u003cp id=\"dialog-copy\">\u003c/p>\u003cform method=\"dialog\">\u003cbutton class=\"submit\">Got it\u003c/button>\u003c/form>\u003c/dialog>\n  \u003cdialog id=\"account-dialog\" aria-labelledby=\"account-title\">\n    \u003ch2 id=\"account-title\">Create your account\u003c/h2>\n    \u003cp id=\"account-description\">\u003c/p>\n    \u003cform id=\"account-form\" method=\"post\">\n      \u003cdiv class=\"field\">\u003clabel for=\"account-username\">Username\u003c/label>\u003cinput id=\"account-username\" name=\"username\" type=\"text\" autocomplete=\"username\" autocapitalize=\"none\" spellcheck=\"false\" pattern=\"[A-Za-z0-9_-]{3,32}\" minlength=\"3\" maxlength=\"32\" required>\u003c/div>\n      \u003cdiv class=\"field\" id=\"recovery-field\" hidden>\u003clabel for=\"recovery-code\">Recovery code\u003c/label>\u003cinput id=\"recovery-code\" name=\"recoveryCode\" type=\"text\" autocomplete=\"off\" spellcheck=\"false\" maxlength=\"64\">\u003c/div>\n      \u003cdiv class=\"field\">\u003clabel for=\"account-password\">Password (12–128 characters)\u003c/label>\u003cinput id=\"account-password\" name=\"password\" type=\"password\" autocomplete=\"new-password\" minlength=\"12\" maxlength=\"128\" required>\u003c/div>\n      \u003cbutton class=\"submit\" id=\"account-submit\" type=\"submit\">Create account\u003c/button>\n    \u003c/form>\n    \u003cdiv id=\"recovery-result\" hidden>\n      \u003cp>Save this recovery code in a safe place. You’ll need it if you forget your password. It is shown only once.\u003c/p>\n      \u003cdiv class=\"field\">\u003clabel for=\"saved-recovery-code\">Your recovery code\u003c/label>\u003cinput id=\"saved-recovery-code\" type=\"text\" readonly autocomplete=\"off\" spellcheck=\"false\">\u003c/div>\n      \u003cbutton class=\"submit\" type=\"button\" id=\"recovery-done\">I saved my code\u003c/button>\n    \u003c/div>\n    \u003cp class=\"status\" id=\"account-status\" role=\"status\">\u003c/p>\n    \u003cbutton class=\"text-button\" type=\"button\" id=\"account-close\" style=\"margin-top:18px\">Close\u003c/button>\n  \u003c/dialog>\n  \n";
const workspaceMarkup = "\u003cstyle>:host{display:block}[hidden]{display:none!important}:host{font-family:system-ui,sans-serif;color:#23332d;background:#fafbf7;font-synthesis:none}*{box-sizing:border-box}:host{margin:0}button,input,textarea{font:inherit}button{cursor:pointer;background:#183e35;color:white;border:1px solid #183e35;border-radius:8px;padding:11px 17px;font-size:14px;font-weight:600}button:hover{background:#2b5748}button:disabled{opacity:.6;cursor:wait}[hidden]{display:none!important}:focus-visible{outline:3px solid #86bba2;outline-offset:3px}.topbar{padding:24px 6%;border-bottom:1px solid #dce4d8;display:flex;justify-content:space-between;align-items:center;gap:15px}.topbar>div{display:flex;align-items:center;gap:18px}.brand{font-size:23px;font-weight:700;color:#183e35;text-decoration:none}.secondary{background:transparent;color:#183e35;border-color:#c6d4c0}.secondary:hover{background:#e7efe2}.topbar span{font-size:14px;overflow-wrap:anywhere}main{max-width:1280px;margin:0 auto;padding:45px 30px}.eyebrow{letter-spacing:2px;font-size:11px;font-weight:700;color:#56734e}h1{font-size:38px;letter-spacing:-1px;margin:12px 0}h2{font-size:21px;margin:0 0 22px}.intro,.hint{color:#63725e;line-height:1.7}.columns{display:grid;grid-template-columns:1.15fr 1fr;align-items:start;gap:28px;margin-top:32px}.card{border:1px solid #dce4d8;background:white;border-radius:18px;padding:28px;min-width:0}label{display:block;font-size:13px;font-weight:600;margin-bottom:8px}input,textarea{display:block;width:100%;border:1px solid #cfd9c9;border-radius:8px;padding:12px;color:#23332d;background:#fdfefa;margin-bottom:18px}textarea{resize:vertical}.actions{display:flex;gap:10px;flex-wrap:wrap}[role=status]{font-size:13px;color:#506847;line-height:1.6}.faq-item{padding:22px 0;border-top:1px solid #e2e8de;overflow-wrap:anywhere}.faq-item h3{font-size:16px;margin:0 0 10px}.faq-item p{font-size:14px;line-height:1.7;white-space:pre-wrap}.faq-item button{padding:7px 13px;font-size:12px}.chat-card{background:#f1f6ed}.chat-heading{display:flex;justify-content:space-between;align-items:baseline;gap:15px}.chat-heading span{font-size:11px;white-space:nowrap;color:#5e7654}.hint{font-size:13px;margin:0 0 20px}#conversation{height:320px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;margin-bottom:22px;padding:3px}.bot-message,.user-message{font-size:14px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere;padding:12px 16px;margin:0;border-radius:12px;max-width:92%}.bot-message{background:white;align-self:flex-start}.user-message{background:#183e35;color:#fff;align-self:flex-end}.source{display:block;margin-top:8px;font-size:11px;color:#617958;border-top:1px solid #dce4d8;padding-top:8px}.empty{font-size:14px;color:#63725e;line-height:1.7}@media(max-width:760px){.columns{grid-template-columns:1fr}main{padding:28px 18px}.card{padding:22px}.topbar{padding:18px;flex-wrap:wrap}h1{font-size:30px}.topbar>div{gap:10px}}\n\u003c/style>\n  \u003cheader class=\"topbar\">\u003ca class=\"brand\" href=\"#\">Klaidorbot.\u003c/a>\u003cdiv>\u003cspan id=\"username\">\u003c/span>\u003cbutton disabled id=\"logout\" type=\"button\" class=\"secondary\">Log out\u003c/button>\u003c/div>\u003c/header>\n  \u003cmain>\n    \u003cp class=\"eyebrow\">YOUR KNOWLEDGE, CONNECTED\u003c/p>\n    \u003ch1>Your FAQ workspace\u003c/h1>\n    \u003cp class=\"intro\">A helpful conversation starts with a good answer. Add your FAQs, then try your assistant.\u003c/p>\n    \u003cp id=\"page-status\" role=\"status\">Loading your workspace…\u003c/p>\n    \u003cbutton id=\"retry-load\" type=\"button\" class=\"secondary\" hidden>Retry loading\u003c/button>\n    \u003cdiv class=\"columns\">\n      \u003csection class=\"card\" aria-labelledby=\"faq-title\">\n        \u003ch2 id=\"faq-title\">Your knowledge base\u003c/h2>\n        \u003cform id=\"faq-form\">\n          \u003clabel for=\"question\">Question\u003c/label>\u003cinput disabled id=\"question\" name=\"question\" maxlength=\"500\" placeholder=\"What are your opening hours?\" required>\n          \u003clabel for=\"answer\">Answer\u003c/label>\u003ctextarea disabled id=\"answer\" name=\"answer\" maxlength=\"5000\" rows=\"4\" placeholder=\"Write the answer your assistant should give…\" required>\u003c/textarea>\n          \u003cdiv class=\"actions\">\u003cbutton disabled id=\"save-faq\" type=\"submit\">Add FAQ\u003c/button>\u003cbutton id=\"cancel-edit\" class=\"secondary\" type=\"button\" hidden>Cancel edit\u003c/button>\u003c/div>\n          \u003cp id=\"faq-status\" role=\"status\">\u003c/p>\n        \u003c/form>\n        \u003cdiv id=\"faq-list\" aria-label=\"Saved FAQs\">\u003c/div>\n      \u003c/section>\n      \u003csection class=\"card chat-card\" aria-labelledby=\"chat-title\">\n        \u003cdiv class=\"chat-heading\">\u003ch2 id=\"chat-title\">Try your assistant\u003c/h2>\u003cspan>FAQ search\u003c/span>\u003c/div>\n        \u003cp class=\"hint\">Answers come from your saved FAQs. If a question has no clear match, the assistant will say so.\u003c/p>\n        \u003cdiv id=\"conversation\" role=\"log\" aria-live=\"polite\" aria-relevant=\"additions\" aria-label=\"Conversation\">\u003cp class=\"bot-message\">Hi! Add an FAQ, then ask me a question about it.\u003c/p>\u003c/div>\n        \u003cform id=\"chat-form\">\u003clabel for=\"chat-question\">Your question\u003c/label>\u003cinput disabled id=\"chat-question\" name=\"question\" maxlength=\"500\" placeholder=\"Ask about your FAQs…\" required>\u003cbutton disabled id=\"send-question\" type=\"submit\">Send question →\u003c/button>\u003cp id=\"chat-status\" role=\"status\">\u003c/p>\u003c/form>\n      \u003c/section>\n    \u003c/div>\n  \u003c/main>\n";
async function showLogin() {
  root.innerHTML = loginMarkup;
  await mountLogin({root, navigate: showWorkspace});
}
async function showWorkspace() {
  root.innerHTML = workspaceMarkup;
  await mountWorkspace({root, navigate: showLogin});
}
root.addEventListener('click', event => {
  if (event.target.closest('a.brand')) event.preventDefault();
});
await showLogin();
